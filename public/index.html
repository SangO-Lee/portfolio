        />
        <meta

            content="웹퍼블리셔, 퍼블리싱, 프론트엔드, 포트폴리오, 웹접근성, 웹표준, 웹개발"

            content="https://sango-lee.github.io/portfolio/"

        <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0..1,0"
        />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <script type="text/javascript">
            (function (l) {
                if (l.search) {
                    var q = {};
                    l.search
                        .slice(1)
                        .split("&")
                        .forEach(function (v) {
                            var a = v.split("=");
                            q[a[0]] = a
                                .slice(1)
                                .join("=")
                                .replace(/~and~/g, "&");
                        });
                    if (q.p !== undefined) {
                        window.history.replaceState(
                            null,
                            null,
                            l.pathname.slice(0, -1) +
                                (q.p || "") +
                                (q.q ? "?" + q.q : "") +
                                l.hash
                        );
                    }
                }
            })(window.location);
        </script>
    </head>
    <body id="body-layout">
        <div id="root"></div>
    </body>
</html>
